<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>K-Glow Beauty | 문의 작성</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="assets/app.css">
</head>
<body>
  <header class="site-header">
    <nav class="nav" aria-label="주요 메뉴">
      <a class="brand" href="index.html">K-GLOW <span>BEAUTY</span></a>
      <div class="search">
        <input type="search" placeholder="상품명 또는 브랜드 검색" disabled>
        <button type="button" aria-label="검색"><i class="fa-solid fa-magnifying-glass"></i></button>
      </div>
      <div class="nav-actions">
        <a class="icon-link" href="login.html" title="로그인" data-user-link><i class="fa-regular fa-user"></i><span data-user-label>로그인</span></a>
        <a class="icon-link" href="inquiry.html" title="문의" data-inquiry-link hidden><i class="fa-regular fa-pen-to-square"></i><span>문의</span></a>
      </div>
    </nav>
  </header>

  <main class="form-shell">
    <h1>문의 작성</h1>
    <p class="muted">상품, 배송, 회원 서비스에 대해 궁금한 점을 남겨주세요.</p>

    <form class="form" data-inquiry-form>
      <div class="field">
        <label for="category">문의 유형</label>
        <select id="category" name="category">
          <option value="상품 문의">상품 문의</option>
          <option value="배송 문의">배송 문의</option>
          <option value="회원 문의">회원 문의</option>
          <option value="기타 문의">기타 문의</option>
        </select>
      </div>
      <div class="field">
        <label for="title">제목</label>
        <input id="title" name="title" type="text" placeholder="문의 제목">
      </div>
      <div class="field">
        <label for="writer">작성자</label>
        <input id="writer" name="writer" type="text" placeholder="작성자 이름">
      </div>
      <div class="field">
        <label for="content">내용</label>
        <textarea id="content" name="content" placeholder="문의 내용을 입력해주세요."></textarea>
      </div>
      <button class="button primary" type="submit">문의 등록</button>
      <p class="form-message" data-inquiry-message></p>
    </form>

    <section aria-label="작성된 문의">
      <div class="section-head" style="margin-top: 42px;">
        <h2>최근 문의</h2>
      </div>
      <div class="inquiry-list" data-inquiry-list></div>
    </section>
  </main>

  <footer class="footer">
    <div class="footer-inner">K-GLOW BEAUTY · Inquiry</div>
  </footer>

  <script src="assets/api.js"></script>
  <script src="assets/inquiry.js"></script>
</body>
</html>
