<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>K-Glow Beauty | 로그인</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="assets/app.css">
</head>
<body>
  <header class="site-header">
    <nav class="nav" aria-label="주요 메뉴">
      <a class="brand" href="index.html">K-GLOW <span>BEAUTY</span></a>
      <div class="search">
        <input type="search" placeholder="상품명 또는 브랜드 검색" disabled>
        <button type="button" aria-label="검색"><i class="fa-solid fa-magnifying-glass"></i></button>
      </div>
      <div class="nav-actions">
        <a class="icon-link" href="login.html" title="로그인" data-user-link><i class="fa-regular fa-user"></i><span data-user-label>로그인</span></a>
        <a class="icon-link" href="inquiry.html" title="문의" data-inquiry-link hidden><i class="fa-regular fa-pen-to-square"></i><span>문의</span></a>
      </div>
    </nav>
  </header>

  <main class="form-shell">
    <h1>로그인</h1>
    <p class="muted">회원 전용 혜택과 문의 내역을 편하게 확인하세요.</p>

    <form class="form" data-login-form>
      <div class="field">
        <label for="email">이메일</label>
        <input id="email" name="email" type="email" placeholder="member@kbeauty.com" autocomplete="email">
      </div>
      <div class="field">
        <label for="password">비밀번호</label>
        <input id="password" name="password" type="password" placeholder="비밀번호" autocomplete="current-password">
      </div>
      <button class="button primary" type="submit">로그인</button>
      <a class="button secondary" href="register.html">회원가입</a>
      <p class="form-message" data-login-message></p>
    </form>

    <div data-auth-panel style="margin-top: 28px;"></div>
  </main>

  <footer class="footer">
    <div class="footer-inner">K-GLOW BEAUTY · Login</div>
  </footer>

  <script src="assets/api.js"></script>
  <script src="assets/auth.js"></script>
</body>
</html>
