<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>K-Glow Beauty | 상품 상세</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="assets/app.css">
</head>
<body>
  <div class="promo">K-Glow Beauty 상품 상세</div>

  <header class="site-header">
    <nav class="nav" aria-label="주요 메뉴">
      <a class="brand" href="index.html">K-GLOW <span>BEAUTY</span></a>
      <div class="search">
        <input type="search" placeholder="상품명으로 다시 검색" disabled>
        <button type="button" aria-label="검색"><i class="fa-solid fa-magnifying-glass"></i></button>
      </div>
      <div class="nav-actions">
        <a class="icon-link" href="login.html" title="로그인" data-user-link><i class="fa-regular fa-user"></i><span data-user-label>로그인</span></a>
        <a class="icon-link" href="inquiry.html" title="문의" data-inquiry-link hidden><i class="fa-regular fa-pen-to-square"></i><span>문의</span></a>
      </div>
    </nav>
  </header>

  <main class="page-shell" data-detail>
    <section class="detail-layout">
      <div class="detail-image">
        <img data-detail-main-image src="" alt="">
      </div>
      <div>
        <a class="detail-brand" href="index.html" data-detail-brand>Brand</a>
        <h1 class="detail-title" data-detail-title>상품 정보를 불러오는 중입니다</h1>
        <p class="subtitle" data-detail-subtitle></p>
        <div class="rating">
          <i class="fa-solid fa-star"></i>
          <i class="fa-solid fa-star"></i>
          <i class="fa-solid fa-star"></i>
          <i class="fa-solid fa-star"></i>
          <i class="fa-solid fa-star-half-stroke"></i>
          <span>12,402건 리뷰</span>
        </div>
        <div class="detail-price">
          <span class="discount" data-discount></span>
          <span class="price" data-current-price></span>
          <span class="original" data-original-price></span>
        </div>
        <div class="badges">
          <span class="badge">무료배송</span>
          <span class="badge">증정 이벤트</span>
          <span class="badge">글로벌 베스트</span>
        </div>
        <div class="info-callout">
          피부 컨디션에 맞춰 매일 부담 없이 사용할 수 있는 데일리 케어 아이템입니다.
        </div>
        <div class="action-row">
          <a class="button secondary" href="inquiry.html" data-inquiry-link hidden>상품 문의</a>
          <button class="button primary" type="button">구매하기</button>
        </div>
      </div>
    </section>

    <nav class="detail-tabs" aria-label="상세 탭">
      <a class="is-active" href="#details">상세정보</a>
      <a href="#reviews">리뷰</a>
      <a href="inquiry.html" data-inquiry-link hidden>Q&amp;A</a>
    </nav>

    <section id="details" class="detail-content">
      <h2 data-content-title>상세정보</h2>
      <p class="muted">성분, 사용감, 추천 루틴을 자세히 확인해보세요.</p>
      <div class="detail-images" data-detail-images>
        <p class="notice">상세 이미지를 불러오는 중입니다...</p>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="footer-inner">K-GLOW BEAUTY · Product Detail</div>
  </footer>

  <script src="assets/api.js"></script>
  <script src="assets/detail.js"></script>
</body>
</html>
